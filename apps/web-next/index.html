<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No inline script, unlike the current app. The production CSP hashes the
      inline scripts of ONE index.html, and a second page carrying its own would
      either be blocked or force a looser policy for both. The locale is applied
      by the first module instead; the cost is one frame of left-to-right on an
      Arabic reload, paid by the preview and not by the site people rely on.
      The JSON-LD that scripts/prerender.mjs adds is a data block, never
      executed, which a Content-Security-Policy does not govern. The title and
      description below are replaced per page by that same script.
    -->
    <title>Plotlogic</title>
    <!-- Light until the reader chooses dark: the browser's own first frame must not paint dark either. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Rule-based development platform for Dubai plots: the affection plan, Dubai Building Code and your brief become capacity, GFA, a parking layout and drawings, all traced."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,400&display=swap"
    />
