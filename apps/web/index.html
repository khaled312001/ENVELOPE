<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <!--
      Light unless the reader asks otherwise, and decided before the first paint.

      `data-theme` is on the element itself rather than applied by React, because
      a theme set after hydration flashes the wrong one first. The script below
      only *overrides* it — a reader who chose dark gets dark, and everyone else
      gets a document that looks like a document. The OS preference is
      deliberately not consulted: this is a report people print and put in front
      of a committee, and a dark screenshot of a capacity study is not what
      anyone wants to paste into a deck.
    -->
    <!--
      THE LOCALE IS DECIDED HERE FOR THE SAME REASON THE THEME IS, and the stakes
      are higher. A theme applied after hydration flashes the wrong colour; a
      DIRECTION applied after hydration lays the whole page out left-to-right, paints
      it, and then reflows every column, every rail and every drawing to the other
      side of the screen. That is not a flash, it is the page visibly assembling
      itself backwards.

      `lang` is set with `dir` and never without it: `lang` selects the Arabic font
      stack and the screen-reader voice, `dir` does the layout, and a page carrying
      one without the other is wrong in a way that looks deliberate.

      Arabic is NOT taken from the browser's `Accept-Language`. The site opens in
      English unless a reader has asked for Arabic, which is the same decision the
      theme comment above records for `prefers-color-scheme` and rests on the same
      fact: this is a document people print and put in front of a committee.
    -->
    <script>
      try {
        var t = localStorage.getItem('envelope.theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
        if (localStorage.getItem('envelope.locale') === 'ar') {
          document.documentElement.setAttribute('lang', 'ar');
          document.documentElement.setAttribute('dir', 'rtl');
        }
        /*
          The same argument as the theme, one property further along: a density
          applied after hydration reflows every table on the page once, and a
          sidebar width applied after hydration flashes wide and then narrow.
          Both are attributes on the element itself, before the first paint.
        */
        var d = localStorage.getItem('envelope.density');
        if (d === 'compact' || d === 'spacious') {
          document.documentElement.setAttribute('data-density', d);
        }
        if (localStorage.getItem('envelope.sidebar') === 'collapsed') {
          document.documentElement.setAttribute('data-sidebar-collapsed', '');
        }
      } catch (e) {
        /* private mode, blocked storage — the light, left-to-right default applies */
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      TOP.ai is the public name. ENVELOPE is the engine inside it, and stays the
      name of the packages, the directories and the storage keys below — renaming
      `envelope.theme` would sign every returning reader out of their own theme
      for a change that is a wordmark, not a migration.
    -->
    <title>TOP.ai — development capacity</title>
    <meta name="color-scheme" content="light dark" />
    <!--
      This was "What can be built on this plot", which is a permission claim: it
      says the scheme is buildable, in the shortest sentence the product owns, on
      the surface that reaches a reader before the page does. The engine's own
      thesis is that it reports what its encoded rules IMPLY, so that is what the
      description says — and social copy is public copy, which is why this string
      goes through the same prohibitions the rendered pages do.
    -->
    <meta
      name="description"
      content="TOP.ai reports what a plot's encoded rules imply, and the derivation of every figure that says so. Regulatory validity is never assessed and never claimed."
    />
    <!--
      IBM Plex, and the reason is not taste.

      Every screen in this product is a column of figures beside the rule that
      produced them, and the system UI stack gets both halves slightly wrong:
      Segoe UI has proportional lining figures, so a digit changing reflows the
      row, and its default mono pairs with nothing. Plex Sans and Plex Mono share
      metrics and a skeleton, so a value can sit in mono inside a sentence set in
      sans without looking pasted in — which is exactly what a traced value is.

      `display=swap` and a full system fallback below it: the page renders
      immediately with or without a network, which matters because this gets
      opened on a site with no wifi. Preconnect so the swap is short when there
      is one.

      THREE DEFECTS IN THE OLD REQUEST, ONE LINE.

      (1) Weight 700 was downloaded on every cold load and set by no rule in the
      whole stylesheet set. Dropped.

      (2) There was no `ital` axis, so every `font-style: italic` rule rendered as
      a browser-synthesised oblique — wrong sidebearings, wrong terminals, wrong
      stroke modulation. One of them is `.not-assessed`, which means a rendering
      artefact was sitting inside a provenance treatment: real italic is one of
      the two non-colour cues NOT ASSESSED has left on a photocopy.

      (3) Weight 300 is added. Plex's characteristic display move is Light at 42px
      and above, and the headline is set on a 61px rung; 600 there is the
      convention Carbon and Stripe both explicitly reject. It does double duty
      here, because lowering the page's total ink weight raises amber's relative
      loudness — the one thing this palette is not allowed to trade away.

      Net: one face fewer, three faces more.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap"
    />
    <!--
      IBM PLEX SANS ARABIC, AND NOT A SUBSTITUTE.

      It is the same typeface family: Plex Arabic was drawn against Plex Latin and
      shares its skeleton, its weights and — the reason it matters here — its
      metrics. Every screen in this product is a column of figures beside the rule
      that produced them, and on an Arabic page the rule is Arabic and the figure is
      still Latin mono. Two unrelated faces in one line is exactly the "pasted in"
      effect the Latin comment above exists to avoid, one script further.

      NO ARABIC MONO, and none is wanted. `--font-mono` carries figures,
      identifiers, formulas and basis strings — all of which stay Latin by the rule
      in `docs/05-design/arabic-glossary.md` — so Plex Mono keeps every job it had.
      Where a mono-set label does hold an Arabic word, `rtl.css` puts this face
      behind Plex Mono in the stack, so the Arabic letters are Plex and every Latin
      letter and digit stays mono.

      Weights 300/400/500/600 to match the Latin request exactly; no italic axis,
      because Arabic has no italic and a synthesised oblique on an Arabic face is
      not a style, it is damage.

      Loaded unconditionally rather than on demand: a reader who switches to Arabic
      has already told us the network may not be there, and a font that arrives
      after the switch would reflow the page a second time.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap"
    />
    <!--
      Inline so there is no second request and no 404 for a file nobody remembered
      to add. The mark is the one in the header: a plot with its setback taken off.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316161a'/%3E%3Crect x='7' y='7' width='18' height='18' fill='none' stroke='%23fbfbfa' stroke-width='1.5'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%232b5cd9'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
